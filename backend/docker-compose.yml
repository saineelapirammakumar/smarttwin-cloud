# Optional: PostgreSQL in Docker (alternative to installing PostgreSQL on Windows).
# Run from this folder:  docker compose up -d      Stop: docker compose down   (data is kept in a Docker volume)
services:
  db:
    image: postgres:16
    container_name: smarttwin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarttwin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env first}
      POSTGRES_DB: ${POSTGRES_DB:-smarttwin}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smarttwin_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smarttwin_user} -d $${POSTGRES_DB:-smarttwin}"]
      interval: 5s
      retries: 10
volumes:
  smarttwin_pgdata:
